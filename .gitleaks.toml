# Secret scanning (CI). Only public keys live in this repository: they're allowed by value, nothing else.
[extend]
useDefault = true

[[allowlists]]
description = "Public client keys: Supabase publishable keys, RevenueCat public SDK keys (Google Play), Sentry DSNs and PostHog project keys"
regexTarget = "match"
regexes = [
    '''sb_publishable_[A-Za-z0-9_-]+''',
    '''goog_[A-Za-z0-9]+''',
    '''https://[0-9a-f]+@o[0-9]+\.ingest\.de\.sentry\.io/[0-9]+''',
    '''phc_[A-Za-z0-9]+''',
]
