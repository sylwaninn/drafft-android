# Secret scanning (CI). Only public keys live in this repository: they're allowed by value, nothing else.
[extend]
useDefault = true

[[allowlists]]
description = "Public client keys: Supabase publishable keys and RevenueCat public SDK keys (Google Play)"
regexTarget = "match"
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''', '''goog_[A-Za-z0-9]+''']
