# Local backend (flavor `local`): `supabase start` in
# drafft-backend, with the staging services (RevenueCat, Stream, R2, FCM, Rekognition come from the
# local Edge Functions' staging secrets, drafft-backend/scripts/local-env.sh). Debug builds only.
# SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY depend on the machine: scripts/local-backend.sh writes them
# to local.private.properties at the repository root (gitignored). Without it the app stops at launch
# and says what's missing. Committed: public keys only.
APP_DISPLAY_NAME=drafft local
# Cloudflare Turnstile public site key (support form sent signed out); allowed for getdrafft.com.
TURNSTILE_SITE_KEY=0x4AAAAAAFF4RVStAyff4tQU
# RevenueCat public SDK key for Google Play (goog_...): the staging project's.
REVENUECAT_API_KEY=goog_zlbFgEtYBibtIBmqabDYPhrrdZj
# Play Integrity needs a build from Google Play, so a local build keeps it off: the device is not attested.
PLAY_INTEGRITY_PROJECT_NUMBER=
# SMS codes land in the local Mailpit, or on the phone with SMS_REAL=true in drafft-backend's
# supabase/functions/.env.local. The local Auth's SMS OTP expiry (GOTRUE_SMS_OTP_EXP), in seconds.
SMS_CODE_LIFETIME=6000
# Telemetry (docs/telemetry.md): off by default on a developer's machine. To test it, put the staging
# values here (environment "local" keeps them apart in Sentry).
SENTRY_DSN=
POSTHOG_API_KEY=
POSTHOG_HOST=https://eu.i.posthog.com
